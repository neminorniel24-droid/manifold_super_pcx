400" fill="#9aa1ac" text-anchor="start" letter-spacing="0" xml:space="preserve" >a piece of a job, sent to a laptop</text><text x="930" y="412" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#eceef1" text-anchor="end" letter-spacing="0" xml:space="preserve" >Laptops dial OUT to the hub, so no port forwarding is needed.</text></svg>