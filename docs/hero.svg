<svg xmlns="http://www.w3.org/2000/svg" width="960" height="262" viewBox="0 0 960 262" role="img" aria-label="Manifold: pool your laptops into one crew"><title>Manifold: pool your laptops into one crew</title><rect width="960" height="262" rx="10" fill="#0b0c0e"/><rect x=".5" y=".5" width="959" height="261" rx="10" fill="none" stroke="#23262c"/><g transform="translate(64,62)" fill="none" stroke="#eceef1" stroke-width="2.4"><rect x="0" y="0" width="34" height="34"/><rect x="16" y="16" width="34" height="34" opacity=".55"/></g><text x="128" y="98" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="200" fill="#eceef1" text-anchor="start" letter-spacing="-1.5" xml:space="preserve" >Manifold</text><text x="66" y="150" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9aa1ac" text-anchor="start" letter-spacing="0" xml:space="preserve" opacity="0">Pool your laptop and your friends' laptops into one crew.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0667;0.0817;0.96;1" dur="9s" repeatCount="indefinite"/></text><text x="66" y="178" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#666d79" text-anchor="start" letter-spacing="0" xml:space="preserve" opacity="0">Collector-style cards. One invite link. Real jobs split across every machine.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1333;0.1483;0.96;1" dur="9s" repeatCount="indefinite"/></text><rect x="66.0" y="214" width="0" height="12" fill="#8d97a6"><animate attributeName="width" values="0;0;93.3;93.3;0" keyTimes="0;0.1556;0.2889;0.96;1" dur="9s" repeatCount="indefinite"/></rect><text x="66" y="248" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#8d97a6" text-anchor="start" letter-spacing="0" xml:space="preserve" opacity="0">Hatchling<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2444;0.2594;0.96;1" dur="9s" repeatCount="indefinite"/></text><rect x="163.3" y="214" width="0" height="12" fill="#d5dbe3"><animate attributeName="width" values="0;0;112.0;112.0;0" keyTimes="0;0.1944;0.3278;0.96;1" dur="9s" repeatCount="indefinite"/></rect><text x="163.3" y="248" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#d5dbe3" text-anchor="start" letter-spacing="0" xml:space="preserve" opacity="0">Wolf<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2833;0.2983;0.96;1" dur="9s" repeatCount="indefinite"/></text><rect x="279.3" y="214" width="0" height="12" fill="#d98b4a"><animate attributeName="width" values="0;0;140.0;140.0;0" keyTimes="0;0.2333;0.3667;0.96;1" dur="9s" repeatCount="indefinite"/></rect><text x="279.3" y="248" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#d98b4a" text-anchor="start" letter-spacing="0" xml:space="preserve" opacity="0">Bull<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3222;0.3372;0.96;1" dur="9s" repeatCount="indefinite"/></text><rect x="423.3" y="214" width="0" height="12" fill="#f2b84b"><animate attributeName="width" values="0;0;186.7;186.7;0" keyTimes="0;0.2722;0.4056;0.96;1" dur="9s" repeatCount="indefinite"/></rect><text x="423.3" y="248" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#f2b84b" text-anchor="start" letter-spacing="0" xml:space="preserve" opacity="0">Tiger<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3611;0.3761;0.96;1" dur="9s" repeatCount="indefinite"/></text><rect x="614.0" y="214" width="0" height="12" fill="#ff5a36"><animate attributeName="width" values="0;0;280.0;280.0;0" keyTimes="0;0.3111;0.4444;0.96;1" dur="9s" repeatCount="indefinite"/></rect><text x="614.0" y="248" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial